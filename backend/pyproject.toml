[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "acsa-eval-api"
version = "0.1.0"
description = "ACSA Self-Evaluation Portal — FastAPI Backend"
requires-python = ">=3.12"
dependencies = [
    # Web framework
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    # Database
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "psycopg2-binary>=2.9",   # used by Alembic for sync migrations
    # Validation / config
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    # Auth (JWT + Keycloak OIDC)
    "python-jose[cryptography]>=3.3",
    "httpx>=0.27",             # for Keycloak JWKS fetch
    # Object storage
    "aioboto3>=13.0",
    # Task queue
    "celery[redis]>=5.4",
    "redbeat>=2.2",
    "kombu>=5.3",
    # Email
    "aiosmtplib>=3.0",
    "jinja2>=3.1",             # email templates
    # PDF generation
    "weasyprint>=62",
    # Excel / CSV
    "openpyxl>=3.1",
    # Utilities
    "python-multipart>=0.0.9",
    "orjson>=3.10",
    "structlog>=24.1",
    "tenacity>=8.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "anyio>=4.4",
    "ruff>=0.4",
    "mypy>=1.10",
    "types-python-jose",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
