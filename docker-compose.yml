version: "3.9"

# ACSA Self-Evaluation Portal — Docker Compose
# All services run together for development and production.
# Production: set APP_ENV=production and provide real secrets via .env

services:
  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: acsa_eval
      POSTGRES_USER: acsa
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U acsa -d acsa_eval"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ── Redis ────────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # ── MinIO (S3-compatible object storage) ────────────────────────────────────
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ── ClamAV (malware scanning) ────────────────────────────────────────────────
  clamd:
    image: clamav/clamav:stable
    platform: linux/amd64
    environment:
      CLAMAV_NO_FRESHCLAMD: "false"
    volumes:
      - clamav_db:/var/lib/clamav
    healthcheck:
      test: ["CMD", "clamdscan", "--ping", "3"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    restart: unless-stopped

  # ── FastAPI backend ──────────────────────────────────────────────────────────
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: acsa-api:${APP_VERSION:-latest}
    environment:
      DATABASE_URL: postgresql+asyncpg://acsa:${POSTGRES_PASSWORD}@db:5432/acsa_eval
      REDIS_URL: redis://redis:6379/0
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      OBJECT_STORAGE_ENDPOINT: http://minio:9000
      OBJECT_STORAGE_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      OBJECT_STORAGE_SECRET_KEY: ${MINIO_SECRET_KEY}
      OBJECT_STORAGE_BUCKET: acsa-evidence
      CLAMD_HOST: clamd
      CLAMD_PORT: "3310"
      APP_ENV: ${APP_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:8081}
      SECRET_KEY: ${SECRET_KEY}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      EMAIL_FROM: ${EMAIL_FROM:-noreply@acsa.local}
    volumes:
      - ./app/catalogue.json:/catalogue.json:ro
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/health/live || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ── Celery worker ────────────────────────────────────────────────────────────
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: acsa-api:${APP_VERSION:-latest}
    command: celery -A app.workers.celery_app worker --loglevel=info -Q default,virus_scan,reports,notifications -c 4
    environment:
      DATABASE_URL: postgresql+asyncpg://acsa:${POSTGRES_PASSWORD}@db:5432/acsa_eval
      REDIS_URL: redis://redis:6379/0
      OBJECT_STORAGE_ENDPOINT: http://minio:9000
      OBJECT_STORAGE_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      OBJECT_STORAGE_SECRET_KEY: ${MINIO_SECRET_KEY}
      OBJECT_STORAGE_BUCKET: acsa-evidence
      CLAMD_HOST: clamd
      CLAMD_PORT: "3310"
      APP_ENV: ${APP_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      EMAIL_FROM: ${EMAIL_FROM:-noreply@acsa.local}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      clamd:
        condition: service_healthy

  # ── Celery beat (scheduled tasks) ────────────────────────────────────────────
  beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: acsa-api:${APP_VERSION:-latest}
    command: celery -A app.workers.celery_app beat --loglevel=info --scheduler redbeat.RedBeatScheduler
    environment:
      REDIS_URL: redis://redis:6379/0
      APP_ENV: ${APP_ENV:-development}
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy

  # ── NGINX reverse proxy ───────────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"
    restart: unless-stopped
    depends_on:
      - api

volumes:
  postgres_data:
  redis_data:
  minio_data:
  clamav_db:
